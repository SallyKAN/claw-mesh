<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>claw-mesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080b12;
  --surface:#0d1119;
  --surface2:#111827;
  --border:#1e293b;
  --border-bright:#334155;
  --text:#e2e8f0;
  --text-dim:#94a3b8;
  --muted:#475569;
  --cyan:#06b6d4;
  --cyan-dim:rgba(6,182,212,0.15);
  --cyan-glow:rgba(6,182,212,0.4);
  --teal:#14b8a6;
  --green:#10b981;
  --green-dim:rgba(16,185,129,0.15);
  --red:#f43f5e;
  --red-dim:rgba(244,63,94,0.15);
  --amber:#f59e0b;
  --amber-dim:rgba(245,158,11,0.15);
}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  height:100vh;
  overflow:hidden;
}

/* Layout: topology (main) + chat (right panel) */
.app{display:flex;height:100vh;position:relative}

/* ===== TOPOLOGY AREA (left 1/3) ===== */
.topology-area{
  width:33%;
  min-width:320px;
  max-width:480px;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  border-right:1px solid var(--border);
}
.topology-area::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 70% at 50% 45%, rgba(6,182,212,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 30% 60%, rgba(20,184,166,0.02) 0%, transparent 60%);
  pointer-events:none;
}

/* Top bar */
.top-bar{
  padding:16px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--surface);
  position:relative;
  z-index:2;
}
.top-bar-left{display:flex;align-items:center;gap:14px}
.brand h1{
  font-family:'Outfit',sans-serif;
  font-size:22px;font-weight:700;letter-spacing:-0.5px;
}
.brand h1 span{
  background:linear-gradient(135deg,var(--cyan),var(--teal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.mesh-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;
  background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(6,182,212,0.2);
}
.cluster-stats{display:flex;gap:20px;margin-left:24px}
.stat{display:flex;align-items:baseline;gap:6px}
.stat-value{
  font-family:'JetBrains Mono',monospace;
  font-size:18px;font-weight:700;line-height:1;
}
.stat-label{font-size:11px;color:var(--muted)}
.top-bar-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s ease;
}
.icon-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.icon-btn.active{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan)}

/* ===== TOPOLOGY CANVAS ===== */
.topology-canvas{
  flex:1;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* Grid background */
.topology-canvas::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(30,41,59,0.3) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,41,59,0.3) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

/* Coordinator hub (center) */
.coord-hub{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.coord-ring{
  width:100px;height:100px;
  border-radius:50%;
  border:2px solid var(--cyan);
  background:radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:0 0 30px rgba(6,182,212,0.15), 0 0 60px rgba(6,182,212,0.05);
}
.coord-ring::after{
  content:'';position:absolute;inset:-6px;
  border-radius:50%;border:1px solid rgba(6,182,212,0.2);
  animation:coord-pulse 3s ease-in-out infinite;
}
@keyframes coord-pulse{
  0%,100%{transform:scale(1);opacity:0.5}
  50%{transform:scale(1.08);opacity:0.2}
}
.coord-icon{font-size:36px;filter:drop-shadow(0 0 12px rgba(6,182,212,0.4))}
.coord-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--cyan);text-align:center;
}
.coord-sublabel{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--muted);
}

/* Node orbit items */
.node-orbit{
  position:absolute;inset:0;
  pointer-events:none;
}
.orbit-node{
  position:absolute;
  pointer-events:all;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:all 0.5s ease;
}

/* Connection line — hidden by default, only shows on active node */
.orbit-line{
  position:absolute;
  pointer-events:none;
  z-index:0;
}
.orbit-line line{
  stroke:transparent;
  stroke-width:0;
}
.orbit-line.active line{
  stroke:var(--cyan);
  stroke-width:1.5;
  stroke-dasharray:6 4;
  stroke-dashoffset:0;
  animation:dash-flow 0.8s linear infinite;
  filter:drop-shadow(0 0 3px rgba(6,182,212,0.4));
}
@keyframes dash-flow{to{stroke-dashoffset:-20}}

/* Data packet animation on active line */
.orbit-line.active .data-packet{
  display:block;
}
.data-packet{
  display:none;
  fill:var(--cyan);
  filter:drop-shadow(0 0 6px var(--cyan));
}

/* Node bubble */
.node-bubble{
  width:64px;height:64px;
  border-radius:16px;
  background:var(--surface2);
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  transition:all 0.3s ease;
  position:relative;
  cursor:default;
}
.node-bubble:hover{border-color:var(--border-bright);transform:scale(1.05)}
.node-bubble.online{border-color:rgba(16,185,129,0.4)}
.node-bubble.busy{border-color:rgba(245,158,11,0.4)}
.node-bubble.offline{border-color:var(--border);opacity:0.5}
.node-bubble.active{
  border-color:var(--cyan);
  box-shadow:0 0 24px rgba(6,182,212,0.2), inset 0 0 16px rgba(6,182,212,0.05);
}

/* Status dot on node bubble */
.node-bubble .n-status{
  position:absolute;top:-3px;right:-3px;
  width:12px;height:12px;border-radius:50%;
  border:2px solid var(--bg);
}
.n-status.online{background:var(--green)}
.n-status.busy{background:var(--amber)}
.n-status.offline{background:var(--red)}

/* Processing spinner on node */
.node-bubble.active::after{
  content:'';position:absolute;inset:-4px;
  border-radius:18px;
  border:2px solid transparent;
  border-top-color:var(--cyan);
  animation:node-spin 1s linear infinite;
}
@keyframes node-spin{to{transform:rotate(360deg)}}

.orbit-name{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:600;color:var(--text);
  white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;
  text-align:center;
}
.orbit-meta{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;color:var(--muted);
  white-space:nowrap;
}
.orbit-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:8px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;
  padding:1px 6px;border-radius:3px;
  margin-top:-2px;
}
.orbit-badge.online{background:var(--green-dim);color:var(--green)}
.orbit-badge.busy{background:var(--amber-dim);color:var(--amber)}
.orbit-badge.offline{background:var(--red-dim);color:var(--red)}
.orbit-badge.processing{background:var(--cyan-dim);color:var(--cyan);animation:badge-pulse 1.5s ease-in-out infinite}
@keyframes badge-pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* Empty state */
.topo-empty{
  position:relative;z-index:2;
  text-align:center;color:var(--muted);font-size:14px;
}
.topo-empty code{
  font-family:'JetBrains Mono',monospace;
  color:var(--cyan);background:var(--cyan-dim);
  padding:2px 8px;border-radius:4px;font-size:12px;
}

/* ===== CHAT PANEL (right) ===== */
.chat-panel{
  flex:1;min-width:0;
  background:var(--surface);
  border-left:none;
  display:flex;flex-direction:column;
  transition:opacity 0.3s ease;
  overflow:hidden;
}
.chat-panel.collapsed{width:0;min-width:0;border-left:none;opacity:0;pointer-events:none}
.chat-header{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.chat-title{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
  color:var(--cyan);
}
.chat-actions{display:flex;gap:6px}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:4px;animation:msg-in 0.3s ease}
.msg.user{align-self:flex-end}
.msg.ai{align-self:flex-start}
@keyframes msg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;word-break:break-word}
.msg.user .msg-bubble{background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;border-bottom-right-radius:4px}
.msg.ai .msg-bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.msg-meta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 4px}
.msg.user .msg-meta{justify-content:flex-end}
.routed-badge{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;
  padding:1px 6px;border-radius:3px;
  background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(6,182,212,0.2);
  display:flex;align-items:center;gap:3px;
}
.routed-badge::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--cyan)}

/* Typing */
.typing{display:none;align-self:flex-start;flex-direction:column;gap:4px;animation:msg-in 0.3s ease}
.typing.show{display:flex}
.typing-bubble{
  padding:10px 16px;background:var(--surface2);border:1px solid var(--border);
  border-radius:14px;border-bottom-left-radius:4px;display:flex;align-items:center;gap:4px;
}
.typing-bubble span{width:6px;height:6px;border-radius:50%;background:var(--cyan);opacity:0.4;animation:typing-dot 1.4s infinite}
.typing-bubble span:nth-child(2){animation-delay:0.2s}
.typing-bubble span:nth-child(3){animation-delay:0.4s}
@keyframes typing-dot{0%,60%,100%{opacity:0.4;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.typing-meta{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--cyan);padding:0 4px;display:flex;align-items:center;gap:4px}
.typing-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--cyan);animation:badge-pulse 1.5s ease-in-out infinite}

/* Welcome */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px}
.welcome-logo{font-size:40px;line-height:1;filter:drop-shadow(0 0 12px rgba(6,182,212,0.3))}
.welcome h2{font-size:16px;font-weight:600;background:linear-gradient(135deg,var(--cyan),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome p{font-size:12px;color:var(--muted);text-align:center;max-width:280px}

/* Input */
.input-area{padding:12px 16px;border-top:1px solid var(--border);background:var(--surface)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-wrapper{flex:1}
.input-wrapper textarea{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-size:13px;
  resize:none;line-height:1.5;min-height:40px;max-height:100px;overflow-y:auto;transition:border-color 0.2s;
}
.input-wrapper textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(6,182,212,0.1)}
.input-wrapper textarea::placeholder{color:var(--muted)}
.send-btn{
  width:40px;height:40px;border-radius:10px;border:none;
  background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;
}
.send-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(6,182,212,0.3)}
.send-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none;box-shadow:none}
.send-btn svg{width:16px;height:16px}
.input-hint{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--muted)}
.route-select{
  font-family:'JetBrains Mono',monospace;padding:2px 8px;border-radius:4px;
  border:1px solid var(--border);background:var(--bg);color:var(--text-dim);font-size:10px;cursor:pointer;
}
.route-select:focus{outline:none;border-color:var(--cyan)}
</style>
</head>
<body>
<div class="app">
  <!-- Main: Topology view -->
  <div class="topology-area">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="brand"><h1><span>claw-mesh</span></h1></div>
        <span class="mesh-badge">v0.1</span>
        <div class="cluster-stats">
          <div class="stat">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">nodes</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-online" style="color:var(--green)">0</span>
            <span class="stat-label">online</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-busy" style="color:var(--amber)">0</span>
            <span class="stat-label">busy</span>
          </div>
        </div>
      </div>
      <div class="top-bar-right">
        <button class="icon-btn active" id="chat-toggle" title="Toggle chat" onclick="toggleChat()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
    </div>

    <div class="topology-canvas" id="topology-canvas">
      <!-- SVG lines layer -->
      <svg class="node-orbit" id="orbit-lines"></svg>

      <!-- Coordinator hub -->
      <div class="coord-hub" id="coord-hub">
        <div class="coord-ring"><span class="coord-icon">&#129438;</span></div>
        <div class="coord-label">Coordinator</div>
        <div class="coord-sublabel">:9180</div>
      </div>

      <!-- Node bubbles rendered by JS -->
    </div>
  </div>

  <!-- Right: Chat panel -->
  <div class="chat-panel" id="chat-panel">
    <div class="chat-header">
      <span class="chat-title">Chat</span>
      <div class="chat-actions">
        <button class="icon-btn" title="Clear chat" onclick="clearChat()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">&#129438;</div>
        <h2>claw-mesh</h2>
        <p>Send a message — it routes to the best node automatically.</p>
      </div>
      <div class="typing" id="typing">
        <div class="typing-bubble"><span></span><span></span><span></span></div>
        <div class="typing-meta"><span class="dot"></span> <span id="typing-node">Processing...</span></div>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <div class="input-wrapper">
          <textarea id="msg-input" rows="1" placeholder="Message the mesh..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-hint">
        <span>Enter to send</span>
        <select class="route-select" id="route-target">
          <option value="auto">auto-route</option>
        </select>
      </div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
const TOKEN = window.__TOKEN__ || '';
let nodesCache = [];
let chatHistory = [];
let activeNodeId = null;
let orbitElements = []; // track rendered orbit nodes

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
function timeStr() {
  return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

// --- Toggle chat panel ---
function toggleChat() {
  const panel = document.getElementById('chat-panel');
  const btn = document.getElementById('chat-toggle');
  panel.classList.toggle('collapsed');
  btn.classList.toggle('active', !panel.classList.contains('collapsed'));
}

// --- OS icon helper ---
function osIcon(os) {
  if (!os) return '&#128187;';
  const o = os.toLowerCase();
  if (o.includes('darwin') || o.includes('mac')) return '&#63743;';
  if (o.includes('linux')) return '&#128039;';
  if (o.includes('win')) return '&#127987;';
  return '&#128187;';
}

// --- Topology: position nodes in orbit around coordinator ---
function renderTopology() {
  const canvas = document.getElementById('topology-canvas');
  const svgLines = document.getElementById('orbit-lines');
  const hub = document.getElementById('coord-hub');

  // Remove old orbit nodes
  orbitElements.forEach(el => el.remove());
  orbitElements = [];
  svgLines.innerHTML = '';

  if (!nodesCache.length) return;

  const rect = canvas.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  const radius = Math.min(cx, cy) * 0.62;
  const count = nodesCache.length;

  nodesCache.forEach((n, i) => {
    const angle = (2 * Math.PI * i / count) - Math.PI / 2;
    const nx = cx + radius * Math.cos(angle);
    const ny = cy + radius * Math.sin(angle);
    const isActive = activeNodeId && n.id === activeNodeId;
    const statusClass = isActive ? 'active' : n.status;
    const badgeClass = isActive ? 'processing' : n.status;
    const os = n.capabilities?.os || '?';
    const arch = n.capabilities?.arch || '?';

    // SVG connection line
    const lineGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    lineGroup.classList.add('orbit-line');
    lineGroup.dataset.nodeId = n.id;
    if (isActive) lineGroup.classList.add('active');

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', nx); line.setAttribute('y2', ny);
    lineGroup.appendChild(line);

    // Animated data packet on active line
    if (isActive) {
      const packet = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      packet.classList.add('data-packet');
      packet.setAttribute('r', '3');
      const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
      anim.setAttribute('dur', '1.5s');
      anim.setAttribute('repeatCount', 'indefinite');
      anim.setAttribute('path', 'M' + cx + ',' + cy + ' L' + nx + ',' + ny);
      packet.appendChild(anim);
      lineGroup.appendChild(packet);
    }

    svgLines.appendChild(lineGroup);

    // Node bubble
    const nodeEl = document.createElement('div');
    nodeEl.className = 'orbit-node';
    nodeEl.style.left = nx + 'px';
    nodeEl.style.top = ny + 'px';
    nodeEl.dataset.nodeId = n.id;
    nodeEl.innerHTML =
      '<div class="node-bubble ' + statusClass + '">' +
        osIcon(os) +
        '<div class="n-status ' + n.status + '"></div>' +
      '</div>' +
      '<span class="orbit-name">' + esc(n.name) + '</span>' +
      '<span class="orbit-meta">' + esc(os) + '/' + esc(arch) + '</span>' +
      '<span class="orbit-badge ' + badgeClass + '">' + (isActive ? 'processing' : n.status) + '</span>';

    canvas.appendChild(nodeEl);
    orbitElements.push(nodeEl);
  });
}

// --- Nodes refresh ---
async function refreshNodes() {
  try {
    const nodes = await fetch(API + '/api/v1/nodes').then(r => r.ok ? r.json() : []);
    nodesCache = nodes || [];

    const onCount = nodesCache.filter(n => n.status === 'online' || n.status === 'busy').length;
    const busyCount = nodesCache.filter(n => n.status === 'busy').length;
    document.getElementById('stat-total').textContent = nodesCache.length;
    document.getElementById('stat-online').textContent = onCount;
    document.getElementById('stat-busy').textContent = busyCount;

    // Update route dropdown
    const sel = document.getElementById('route-target');
    const cur = sel.value;
    sel.innerHTML = '<option value="auto">auto-route</option>';
    nodesCache.forEach(n => {
      sel.innerHTML += '<option value="' + esc(n.id) + '">' + esc(n.name) + '</option>';
    });
    sel.value = cur;

    renderTopology();
  } catch(e) { console.error('refreshNodes:', e); }
}

// --- Chat ---
function addMessage(role, text, meta) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let metaHTML = '<span>' + timeStr() + '</span>';
  if (meta?.node_id) {
    const nodeName = nodesCache.find(n => n.id === meta.node_id)?.name || meta.node_id.slice(0,8);
    metaHTML += ' <span class="routed-badge">' + esc(nodeName) + '</span>';
  }
  div.innerHTML = '<div class="msg-bubble">' + esc(text) + '</div><div class="msg-meta">' + metaHTML + '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  chatHistory.push({role, text, meta});
}

function setActiveNode(nodeId) {
  activeNodeId = nodeId;
  renderTopology();
}
function clearActiveNode() {
  activeNodeId = null;
  renderTopology();
}

function showTyping(show, nodeName) {
  const t = document.getElementById('typing');
  const container = document.getElementById('messages');
  if (show) {
    container.appendChild(t);
    document.getElementById('typing-node').textContent = nodeName ? 'Running on ' + nodeName : 'Routing...';
  }
  t.classList.toggle('show', show);
  if (show) container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const msg = input.value.trim();
  if (!msg) return;
  const target = document.getElementById('route-target').value;
  input.value = '';
  autoResize(input);
  addMessage('user', msg);
  showTyping(true);
  document.getElementById('send-btn').disabled = true;

  // Open chat panel if collapsed
  const chatPanel = document.getElementById('chat-panel');
  if (chatPanel.classList.contains('collapsed')) toggleChat();

  // Highlight node in topology during processing
  if (target !== 'auto') {
    setActiveNode(target);
    const nodeName = nodesCache.find(n => n.id === target)?.name || target.slice(0,8);
    showTyping(true, nodeName);
  } else {
    // Auto-route: highlight the first online node as a visual cue
    const onlineNode = nodesCache.find(n => n.status === 'online') || nodesCache[0];
    if (onlineNode) {
      setActiveNode(onlineNode.id);
      showTyping(true, onlineNode.name);
    }
  }

  const url = target === 'auto' ? '/api/v1/route' : '/api/v1/route/' + target;
  try {
    const r = await fetch(API + url, {
      method: 'POST',
      headers: {'Content-Type':'application/json', ...(TOKEN ? {'Authorization':'Bearer '+TOKEN} : {})},
      body: JSON.stringify({content: msg, source: 'dashboard'})
    });
    const data = await r.json();
    showTyping(false);

    if (r.ok) {
      // Flash the actual responding node
      if (data.node_id) {
        setActiveNode(data.node_id);
        setTimeout(clearActiveNode, 2000);
      } else {
        clearActiveNode();
      }
      addMessage('ai', data.response || 'Message routed.', {node_id: data.node_id});
    } else {
      clearActiveNode();
      addMessage('ai', 'Error: ' + (data.error || r.statusText));
    }
  } catch(e) {
    showTyping(false);
    clearActiveNode();
    addMessage('ai', 'Failed: ' + e.message);
  }
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
function clearChat() {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  const w = document.createElement('div');
  w.className = 'welcome'; w.id = 'welcome';
  w.innerHTML = '<div class="welcome-logo">&#129438;</div><h2>claw-mesh</h2><p>Send a message — it routes to the best node automatically.</p>';
  container.appendChild(w);
  const t = document.createElement('div');
  t.className = 'typing'; t.id = 'typing';
  t.innerHTML = '<div class="typing-bubble"><span></span><span></span><span></span></div><div class="typing-meta"><span class="dot"></span> <span id="typing-node">Processing...</span></div>';
  container.appendChild(t);
  chatHistory = [];
}

// --- Init ---
refreshNodes();
setInterval(refreshNodes, 5000);
window.addEventListener('resize', renderTopology);
document.getElementById('msg-input').focus();
</script>
</body>
</html>
